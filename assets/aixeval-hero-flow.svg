<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">AIXeval post-hoc scoring flow</title>
  <desc id="desc">Ingest, metrics, judge, and trace feed an eight-question scorecard.</desc>
  <defs>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
  <stop offset="100%" stop-color="#f8f4f8" stop-opacity="0.6"/>
  </radialGradient>
  </defs>
  <circle cx="180" cy="180" r="118" fill="none" stroke="#e2e0e6" stroke-width="1.5" opacity="0.9"/>
  <circle cx="180" cy="180" r="88" fill="none" stroke="#e2e0e6" stroke-width="1" opacity="0.7"/>
  <circle cx="180" cy="180" r="58" fill="url(#glow)" stroke="#ffffff" stroke-width="3"/>
  <text x="180" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">Eight-question</text>
  <text x="180" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">card</text>
  <text x="180" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#5c5c5c">grades 0-4</text>
  <g>
  <circle cx="180" cy="52" r="34" fill="#48c0d9"/>
  <text x="180" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#fff">Ingest</text>
  </g>
  <g>
  <circle cx="308" cy="180" r="34" fill="#eb088a"/>
  <text x="308" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff">Metrics</text>
  </g>
  <g>
  <circle cx="180" cy="308" r="34" fill="#7c6fe8"/>
  <text x="180" y="312" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff">Judge</text>
  </g>
  <g>
  <circle cx="52" cy="180" r="34" fill="#3d8bfd"/>
  <text x="52" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff">Trace</text>
  </g>
</svg>
