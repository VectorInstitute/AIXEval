# GitHub Release only (sdist + wheel). PyPI publish is intentionally disabled.
name: release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.11"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Build package
        run: uv build

      - name: Create or update GitHub Release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "dist/*"
          allowUpdates: true
          generateReleaseNotes: false