extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/fix-project-pages.js
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VectorInstitute/aixeval
    - icon: fontawesome/solid/landmark
      link: https://vectorinstitute.ai
markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
copyright: Copyright &copy; 2026 Vector Institute. Apache 2.0. Vector logos are trademarks and are not licensed.
nav:
  - Home: index.md
  - Get started:
      - getting-started/index.md
      - Setup: user_guide.md
  - Concepts:
      - concepts/index.md
      - Methodology: methodology.md
      - Interpreting results: interpreting-results.md
      - Limitations: limitations.md
  - Metric library:
      - Catalog: metric-catalog.md
  - How-to:
      - how-to/index.md
      - Privacy and data: privacy-and-data.md
      - Self-hosting a judge: self-hosting.md
      - Judge providers: judge-providers.md
      - Self-hosted vLLM: judge-vllm.md
  - Extend:
      - extending/index.md
      - Add a metric: extending/add-a-metric.md
      - Contributing: extending/contributing.md
  - About:
      - about/index.md
      - Roadmap: about/roadmap.md
      - Acknowledgments: about/acknowledgments.md
      - Licence and citation: about/license-and-citation.md
  - API Reference: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            members_order: source
            separate_signature: true
            show_overloads: true
            show_submodules: true
            show_root_heading: false
            show_root_full_path: true
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
repo_url: https://github.com/VectorInstitute/aixeval
repo_name: VectorInstitute/aixeval
site_name: AIXeval
# GitHub Project Pages subpath. Must match the repo name, or nested pages lose their CSS.
site_url: https://vectorinstitute.github.io/aixeval/
theme:
  custom_dir: docs/overrides
  favicon: assets/favicon-48x48.svg
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/vector-logo.svg
  logo_footer: assets/vector-logo.svg
  name: material
  font:
    text: Plus Jakarta Sans
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: vector-teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: vector-teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
